# 品牌政策（Brand Policy）
brand: JuanerAI
tone: 克制、诚实、专业；承认边界，不辩解、不夸张

positioning: |
  BI 给数据；智能问数给答案；JuanerAI 给可验证、可比较、可执行的决策候选。

required:
  - 区分四类内容：事实 / 产品能力 / 分析推断 / 品牌观点，后两者不得伪装成前两者
  - 涉及限制与反方观点的段落必须保留
  - AI 生成或合成内容按平台规则完成标识

forbidden:
  - 经营效果与 ROI 承诺（如「提升业绩 30%」）
  - 未经授权的客户名称、数据与案例细节
  - 竞品评价与拉踩
  - 夸大表达（如「闭眼冲」「史上最强」「永远正确」）
  - 暗示尚未上线或明确不支持的能力（以 config/product-truth.yaml 为准）
  - 泄露企业或个人敏感信息

high_risk_requires_human:   # 以下内容必须人工复核
  - 经营效果与 ROI
  - 客户案例
  - 竞品评价
  - 法律与政策
  - 数据安全承诺
  - 企业自动驾驶能力
  - 尚未上线的产品能力
  - 涉及真实企业与个人的数据
